name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Check history secrecy
        run: |
          python3 scripts/check_history.py
          python3 scripts/check_settlement_markers.py --min-px 0

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'source/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            ./ _site/
          test -f _site/index.html
          test -f _site/data/world.json
          test -f _site/data/lookup.png
          test -f _site/data/claims.json
          test -f _site/data/infrastructure.geojson
          test -f _site/data/infrastructure.json
          test -f _site/data/history/index.json
          test -f _site/data/history/cycle-0.json
          test -f _site/data/sectors.geojson
          test -f _site/data/sector_control.csv
          test -f _site/data/buildings.csv
          test -f _site/data/alliances.csv
          test -f _site/data/province_slots.json
          test -f _site/data/settlement_name_overrides.csv
          test -f _site/data/province_names.csv
          test -f _site/data/flags.json
          test -f _site/data/rivers.geojson
          test -f _site/js/history.js
          test -f _site/assets/overview.webp
          test -d _site/tiles/political

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
